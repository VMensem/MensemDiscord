<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensem | Discord Community</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #ff3333;
            --card-bg: #161616;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        header { padding: 50px 20px; text-align: center; }
        h1 { color: var(--accent-color); font-size: 3rem; margin: 0; }
        .btn { display: inline-block; padding: 12px 24px; background-color: var(--accent-color); color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; font-weight: bold; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 50px 20px; max-width: 1000px; width: 100%; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        .status { padding: 20px; background-color: #1a1a1a; border-radius: 10px; margin-top: 30px; border-left: 5px solid #28a745; }
        footer { padding: 30px; font-size: 0.9rem; opacity: 0.7; }
    </style>
</head>
<body>
    <header>
        <h1>MensemBot for Mensem</h1>
        <p>Discord Community</p>
        <a href="https://discord.gg/mensem" class="btn">Перейти в Discord</a>
    </header>

    <section class="features">
        <div class="card"><h3>🎫 Tickets</h3><p>Быстрая помощь</p></div>
        <div class="card"><h3>🎉 Events</h3><p>Интересные активности</p></div>
        <div class="card"><h3>🛡 Staff</h3><p>Дружное сообщество</p></div>
        <div class="card"><h3>🎤 Voice</h3><p>Игровые комнаты</p></div>
    </section>

    <div class="status">🟢 Systems Operational</div>

    <footer>© 2026 Mensem System • Все права защищены.</footer>
</body>
</html>

{% extends 'base.html' %}
{% block content %}
<div class="grid">
    {% for tool in tools %}
    <div class="card">
        <h3>{{ tool.name }}</h3>
        <p>{{ tool.status }}</p>
        {% if tool.link %}<a href="{{ tool.link }}">Открыть</a>{% endif %}
    </div>
    {% endfor %}
</div>
{% endblock %}
